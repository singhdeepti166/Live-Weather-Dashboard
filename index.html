
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <header class="header">
            <p class="tag">LIVE WEATHER</p>
            <h1>Weather Dashboard</h1>
            <p class="subtitle">
                Discover the weather anywhere in the world.
            </p>
        </header>

        <section class="search-section">
            <form id="search-form">
                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city name..."
                    autocomplete="off"
                    aria-label="Search city"
                >

                <button type="submit" id="search-btn">
                    Search
                </button>
            </form>

            <p id="status" role="status" aria-live="polite"></p>
        </section>

        <section id="current-weather" class="current-weather">
        </section>

        <section class="forecast-section">
            <h2>5-Day Forecast</h2>

            <div id="forecast" class="forecast-grid">
            </div>
        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>

    </main>

</body>
</html>
